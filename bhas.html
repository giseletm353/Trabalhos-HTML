<!-- -elabore um texto explicativo
 -inclua formulário com 3 inputs de texto para digitação dos parâmetros a, b e c
 - inclua no formulário um botão calcular e associe a função que calculaas raízes em JS
 -inclua no formulário uma área de saída de resultado.-->
 <!DOCTYPE html>
 <html lang="pt-br">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bhas.css">
    <link rel="icon" href="image/calc.png" type="image/png">
    <title>Bhaskara</title>
 </head>
 <body>
    
      <form id="bhaskaraForm">
         <fieldset>
            <legend>Calculadora de Bhaskara</legend>
            <p>Esta calculadora permite que você encontre as raízes de uma equação quadrática da forma <b> ax² + bx + c = 0</b>, utilizando a fórmula de Bhaskara. Para isso, insira os valores dos coeficientes a, b e c nos campos abaixo e clique em "Calcular".</p><br>
            <label for="a">Coeficiente a:</label>
            <input type="text" id="a" name="a" required><br><br>
            <label for="b">Coeficiente b:</label>
            <input type="text" id="b" name="b" required><br><br>
            <label for="c">Coeficiente c:</label>
            <input type="text" id="c" name="c" required><br><br>
            <button type="button" onclick="calcularBhaskara()">Calcular</button><br>
            <div id="resultado"></div>
         </fieldset>
      </form>
      
      <script src="bhas.js"></script>

 </body>
 </html>
