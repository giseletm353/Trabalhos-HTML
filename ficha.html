<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ficha.css">
    <link rel="icon" href="image/arquivo.png" type="image/png">
    <title>Ficha de Inscrição</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend> Ficha de Inscrição: </legend>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>
            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" required><br><br>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" required><br><br>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required><br><br>
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" pattern="\(\d{2}\)\s\d{5}-\d{4}" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>
            Gênero:<br>
            <label>
                <select name="genero" id="genero">
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Outro">Outro</option>
                </select>
            </label><br><br>
            Distância da Corrida:<br>
            <label>
                <input type="radio" name="distancia" value="5"> 5km <br>
                <input type="radio" name="distancia" value="10"> 10km <br>
                <input type="radio" name="distancia" value="15"> 15km
            </label><br><br>
            Marque quais itens deseja receber:<br>
            <label>
                <input type="checkbox" name="itens" value="Camiseta"> Camiseta <br>
                <input type="checkbox" name="itens" value="Medalha"> Medalha <br>
                <input type="checkbox" name="itens" value="Banana"> Banana
            </label><br><br>
            Digite comentários ou observações:<br>
            <textarea name="observacoes" cols="40" rows="5" maxlength="500"></textarea>
            <input type="submit" value="Enviar">
        </fieldset>
    </form>
</body>
</html>
